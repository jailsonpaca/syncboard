name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev clang libclang-dev pkg-config libssl-dev libxdo-dev

      - name: Install JS deps
        run: |
          npm ci || npm install
          cd client && (npm ci || npm install)

      - name: Sync version from tag
        run: node scripts/bump-version.js "${GITHUB_REF_NAME}"

      - name: Build Tauri release (Linux)
        run: npx tauri build --bundles deb,appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS deps
        run: |
          npm ci || npm install
          cd client && (npm ci || npm install)

      - name: Sync version from tag
        run: node scripts/bump-version.js "${GITHUB_REF_NAME}"

      - name: Build Tauri release (macOS)
        run: npx tauri build --bundles dmg,app

      - name: Zip macOS .app
        run: |
          VER=$(node -p "require('./package.json').version")
          cd target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent SyncBoard.app "SyncBoard-${VER}-arm64-mac.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS deps
        shell: bash
        run: |
          npm ci || npm install
          cd client && (npm ci || npm install)

      - name: Sync version from tag
        shell: bash
        run: node scripts/bump-version.js "${GITHUB_REF_NAME}"

      - name: Build Tauri release (Windows)
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            target/release/bundle/nsis/*.exe

  publish:
    needs: [build-linux, build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) -exec cp {} dist-release/ \;
          ls -lah dist-release

      - name: Generate latest.json
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const dir = 'dist-release';
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const owner = process.env.GITHUB_REPOSITORY_OWNER;
          const repo = process.env.GITHUB_REPOSITORY.split('/')[1];
          const base = `https://github.com/${owner}/${repo}/releases/download/v${version}`;
          const files = fs.readdirSync(dir);
          const pick = (...res) => {
            for (const re of res) {
              const hit = files.find((f) => re.test(f));
              if (hit) return hit;
            }
            return null;
          };
          const macDmg = pick(/\.dmg$/i);
          const macZip = pick(/-mac\.zip$/i, /darwin.*\.zip$/i);
          const linuxAppImage = pick(/\.AppImage$/i);
          const linuxDeb = pick(/\.deb$/i);
          const winSetup = pick(/setup.*\.exe$/i, /\.exe$/i);
          const androidApk = pick(/-arm64\.apk$/i, /\.apk$/i);
          let downloadPage = process.env.SYNCBOARD_DOWNLOAD_URL || '';
          try {
            downloadPage = JSON.parse(fs.readFileSync('release.config.json', 'utf8')).downloadUrl || downloadPage;
          } catch { /* ok */ }
          const latest = {
            version,
            publishedAt: new Date().toISOString(),
            downloadPage,
            github: { owner, repo, tag: `v${version}` },
            assets: {
              macDmg: macDmg ? `${base}/${macDmg}` : null,
              macZip: macZip ? `${base}/${macZip}` : null,
              linuxAppImage: linuxAppImage ? `${base}/${linuxAppImage}` : null,
              linuxDeb: linuxDeb ? `${base}/${linuxDeb}` : null,
              winSetup: winSetup ? `${base}/${winSetup}` : null,
              androidApk: androidApk ? `${base}/${androidApk}` : null,
            },
            files: { macDmg, macZip, linuxAppImage, linuxDeb, winSetup, androidApk },
          };
          fs.writeFileSync(path.join(dir, 'latest.json'), JSON.stringify(latest, null, 2));
          console.log(latest);
          EOF
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
