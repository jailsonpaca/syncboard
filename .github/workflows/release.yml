name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm run install:all

      - name: Sync version from tag
        run: node scripts/bump-version.js "${GITHUB_REF_NAME}"

      - name: Build release (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNCBOARD_GH_OWNER: ${{ github.repository_owner }}
          SYNCBOARD_GH_REPO: ${{ github.event.repository.name }}
        run: |
          npm run build
          cd server && npm install --omit=dev --no-audit --no-fund
          cd ../desktop
          npm install --no-audit --no-fund
          node generate-icons.js
          # Preparar resources
          rm -rf resources && mkdir -p resources/server resources/client
          cp -r ../server/dist resources/server/
          cp ../server/package.json resources/server/
          cp ../release.config.json resources/server/
          cp -r ../server/node_modules resources/server/
          cp -r ../client/dist/* resources/client/
          ELECTRON_VERSION=$(node -p "require('./node_modules/electron/package.json').version")
          npx @electron/rebuild -v "$ELECTRON_VERSION" -m . -w better-sqlite3 -p resources/server
          npx electron-builder --linux AppImage tar.gz deb --x64 --publish never
          # Nome estável
          VER=$(node -p "require('../package.json').version")
          if [ -f "release/SyncBoard-${VER}-x64.tar.gz" ]; then
            cp -f "release/SyncBoard-${VER}-x64.tar.gz" release/SyncBoard-linux-x64.tar.gz
          fi
          node ../scripts/write-latest-json.js

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            desktop/release/*.AppImage
            desktop/release/*.tar.gz
            desktop/release/*.deb
            desktop/release/latest*.yml
            desktop/release/latest.json

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm run install:all

      - name: Sync version from tag
        run: node scripts/bump-version.js "${GITHUB_REF_NAME}"

      - name: Build release (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SYNCBOARD_GH_OWNER: ${{ github.repository_owner }}
          SYNCBOARD_GH_REPO: ${{ github.event.repository.name }}
        run: |
          npm run build
          cd server && npm install --omit=dev --no-audit --no-fund
          cd ../desktop
          npm install --no-audit --no-fund
          node generate-icons.js
          rm -rf resources && mkdir -p resources/server resources/client
          cp -r ../server/dist resources/server/
          cp ../server/package.json resources/server/
          cp ../release.config.json resources/server/
          cp -r ../server/node_modules resources/server/
          cp -r ../client/dist/* resources/client/
          ELECTRON_VERSION=$(node -p "require('./node_modules/electron/package.json').version")
          npx @electron/rebuild -v "$ELECTRON_VERSION" -m . -w better-sqlite3 -p resources/server
          npx electron-builder --mac dmg zip --x64 --publish never
          node ../scripts/write-latest-json.js

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            desktop/release/*.dmg
            desktop/release/*-mac.zip
            desktop/release/*.zip
            desktop/release/latest*.yml
            desktop/release/latest.json

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          npm ci || npm install
          npm run install:all

      - name: Sync version from tag
        shell: bash
        run: node scripts/bump-version.js "${GITHUB_REF_NAME}"

      - name: Build release (Windows)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SYNCBOARD_GH_OWNER: ${{ github.repository_owner }}
          SYNCBOARD_GH_REPO: ${{ github.event.repository.name }}
        run: |
          npm run build
          cd server && npm install --omit=dev --no-audit --no-fund
          cd ../desktop
          npm install --no-audit --no-fund
          node generate-icons.js
          rm -rf resources && mkdir -p resources/server resources/client
          cp -r ../server/dist resources/server/
          cp ../server/package.json resources/server/
          cp ../release.config.json resources/server/
          cp -r ../server/node_modules resources/server/
          cp -r ../client/dist/* resources/client/
          ELECTRON_VERSION=$(node -p "require('./node_modules/electron/package.json').version")
          npx @electron/rebuild -v "$ELECTRON_VERSION" -m . -w better-sqlite3 -p resources/server
          npx electron-builder --win nsis zip --x64 --publish never
          node ../scripts/write-latest-json.js

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            desktop/release/*.exe
            desktop/release/*-win.zip
            desktop/release/*.zip
            desktop/release/latest*.yml
            desktop/release/latest.json

  publish:
    needs: [build-linux, build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.exe' -o -name 'latest*.yml' -o -name 'latest.json' \) -exec cp {} dist-release/ \;
          ls -lah dist-release

      - name: Merge latest.json
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const dir = 'dist-release';
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const owner = process.env.GITHUB_REPOSITORY_OWNER;
          const repo = process.env.GITHUB_REPOSITORY.split('/')[1];
          const base = `https://github.com/${owner}/${repo}/releases/download/v${version}`;
          const files = fs.readdirSync(dir);
          const pick = (...res) => {
            for (const re of res) {
              const hit = files.find((f) => re.test(f));
              if (hit) return hit;
            }
            return null;
          };
          const macDmg = pick(/\.dmg$/i);
          const macZip = pick(/-mac\.zip$/i, /darwin.*\.zip$/i);
          const linuxAppImage = pick(/\.AppImage$/i);
          const linuxTar = pick(/linux.*\.tar\.gz$/i, /\.tar\.gz$/i);
          const winSetup = pick(/Setup.*\.exe$/i, /\.exe$/i);
          const winZip = pick(/-win\.zip$/i, /windows.*\.zip$/i, /win32.*\.zip$/i);
          let downloadPage = process.env.SYNCBOARD_DOWNLOAD_URL || '';
          try {
            downloadPage = JSON.parse(fs.readFileSync('release.config.json', 'utf8')).downloadUrl || downloadPage;
          } catch { /* ok */ }
          const latest = {
            version,
            publishedAt: new Date().toISOString(),
            downloadPage,
            github: { owner, repo, tag: `v${version}` },
            roadmap: {
              android: {
                status: 'roadmap',
                available: false,
                note: 'App nativo Android planejado; indisponível no momento.',
              },
            },
            assets: {
              macDmg: macDmg ? `${base}/${macDmg}` : null,
              macZip: macZip ? `${base}/${macZip}` : null,
              linuxAppImage: linuxAppImage ? `${base}/${linuxAppImage}` : null,
              linuxTar: linuxTar ? `${base}/${linuxTar}` : null,
              winSetup: winSetup ? `${base}/${winSetup}` : null,
              winZip: winZip ? `${base}/${winZip}` : null,
            },
            files: { macDmg, macZip, linuxAppImage, linuxTar, winSetup, winZip },
          };
          fs.writeFileSync(path.join(dir, 'latest.json'), JSON.stringify(latest, null, 2));
          console.log(latest);
          EOF
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
